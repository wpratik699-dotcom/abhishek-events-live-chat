<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Dashboard — Abhishek Events</title><link rel="stylesheet" href="/dashboard.css"></head><body><div id="app"></div><div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
const API_BASE="https://abhishek-events-live-chat.onrender.com";const token=localStorage.getItem("ae_agent_token");if(!token)location.href="/agent-login.html";let selected=null,socket=null,me=null,refreshTimer;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function api(path,opt={}){const r=await fetch(API_BASE+path,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{}),Authorization:"Bearer "+token}});let d={};try{d=await r.json()}catch{}if(!r.ok){if(r.status===401){localStorage.removeItem("ae_agent_token");location.href="/agent-login.html"}throw Error(d.error||"Request failed")}return d}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
async function init(){try{me=await api("/api/agent/me");document.getElementById("app").innerHTML=`<header class="top"><div class="brand"><span>✦</span> Abhishek Events <span style="color:#aaa;font:600 12px Arial">AGENT PORTAL</span></div><div class="top-right"><div class="user-chip">${esc(me.name)} · @${esc(me.username)}</div><button class="btn small" onclick="logout()">Logout</button></div></header><main class="wrap"><section class="hero"><div><div class="eyebrow">Customer Support</div><h1>Agent Dashboard</h1><p>Handle assigned customer chats and see the live queue at a glance.</p></div><div class="actions"><button class="btn gold" onclick="openPassword()">🔐 My Password</button><button class="btn ghost" onclick="refreshAll()">↻ Refresh</button></div></section><section id="stats" class="stats"></section><section class="layout agent-layout"><div><div class="card"><div class="card-head"><h2>My Availability</h2><span id="statusBadge" class="badge"></span></div><div class="profile"><div class="avatar">${esc((me.name||"A").charAt(0).toUpperCase())}</div><div><b>${esc(me.name)}</b><div class="person-meta">Capacity ${me.current}/${me.capacity}</div></div></div><div class="online-toggle"><button class="btn gold" onclick="setOnline(true)">🟢 Go Online</button><button class="btn" onclick="setOnline(false)">🔴 Go Offline</button></div><div class="capacity-bar"><div id="capFill" class="capacity-fill"></div></div></div><div class="card"><div class="card-head"><h2>My Customers</h2><span class="refresh">Live list</span></div><div id="list" class="list"></div></div></div><div class="card"><div class="card-head"><h2 id="title">Select a customer</h2><span id="chatStatus" class="badge">No chat selected</span></div><div id="messages" class="messages"><div class="empty">Select a customer from the left to start replying.</div></div><div class="composer"><input id="messageInput" class="input" placeholder="Type a reply..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn gold" onclick="sendMessage()">Send</button></div><button id="closeBtn" class="btn danger" style="margin-top:10px;display:none" onclick="closeChat()">Close Conversation</button></div></section></main>`;await refreshAll();await setOnline(true);refreshTimer=setInterval(refreshAll,5000)}catch(e){toast(e.message)}}
function renderStats(s){document.getElementById("stats").innerHTML=`<div class="stat"><div class="stat-icon">💬</div><div class="stat-label">My Active Chats</div><div class="stat-value">${s.assignedActive}</div><div class="stat-sub">Customers waiting for your reply</div></div><div class="stat"><div class="stat-icon">⏳</div><div class="stat-label">Waiting Queue</div><div class="stat-value">${s.waitingChats}</div><div class="stat-sub">Customers waiting for an available agent</div></div><div class="stat"><div class="stat-icon">✓</div><div class="stat-label">My Closed Chats</div><div class="stat-value">${s.assignedClosed}</div><div class="stat-sub">Conversations handled by you</div></div><div class="stat"><div class="stat-icon">📊</div><div class="stat-label">Total Assigned</div><div class="stat-value">${s.totalAssigned}</div><div class="stat-sub">All chats assigned to this account</div></div>`}
async function refreshAll(){const [stats,rows,newMe]=await Promise.all([api("/api/agent/stats"),api("/api/agent/conversations"),api("/api/agent/me")]);me=newMe;renderStats(stats);renderList(rows);updateStatus(me)}
function updateStatus(m){const b=document.getElementById("statusBadge"),f=document.getElementById("capFill");if(!b)return;b.className="badge "+(m.online&&m.active?"online":"offline");b.innerHTML=`<span class="dot"></span>${m.online&&m.active?"Online":"Offline"}`;if(f)f.style.width=Math.min(100,m.capacity?m.current/m.capacity*100:0)+"%"}
function renderList(rows){const el=document.getElementById("list");el.innerHTML=rows.length?rows.map(x=>`<div class="conversation ${selected===x.id?"active":""}" onclick="openChat(${x.id},'${esc(x.customer_name).replace(/'/g,"&#39;")}')"><div class="conversation-title">${esc(x.customer_name)}</div><div class="conversation-meta"><span class="badge ${x.status}">${esc(x.status)}</span> · ${esc(x.created_at)}</div></div>`).join(""):`<div class="empty">No customers assigned yet.<br><br><span class="muted">Keep this account online to receive new chats.</span></div>`}
async function openChat(id,name){selected=id;document.getElementById("title").textContent="Chat with "+name;try{const d=await api("/api/agent/conversations/"+id+"/messages");renderMessages(d.messages);const b=document.getElementById("chatStatus");b.className="badge "+d.conversation.status;b.textContent=d.conversation.status;document.getElementById("closeBtn").style.display=d.conversation.status==="closed"?"none":"block";connect(id)}catch(e){toast(e.message)}}
function renderMessages(ms){document.getElementById("messages").innerHTML=ms.length?ms.map(m=>`<div class="msg ${m.sender_type}">${esc(m.message)}<div class="small">${esc(m.created_at)}</div></div>`).join(""):`<div class="empty">No messages yet.</div>`;scrollMessages()}
function connect(id){if(socket)socket.close();socket=new WebSocket("wss://abhishek-events-live-chat.onrender.com/?conversationId="+id+"&token="+encodeURIComponent(token));socket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==="message"){const wrap=document.getElementById("messages");const empty=wrap.querySelector(".empty");if(empty)empty.remove();const el=document.createElement("div");el.className="msg "+d.message.sender_type;el.innerHTML=esc(d.message.message)+`<div class="small">${esc(d.message.created_at)}</div>`;wrap.appendChild(el);scrollMessages()}if(d.type==="conversation"){refreshAll()}}catch{}};socket.onclose=()=>{}};
function sendMessage(){const input=document.getElementById("messageInput"),v=input.value.trim();if(!v||!socket||socket.readyState!==1)return;socket.send(JSON.stringify({message:v}));input.value=""}
async function closeChat(){if(!selected)return;try{await api("/api/conversations/"+selected+"/close",{method:"POST"});toast("Conversation closed");if(socket)socket.close();selected=null;document.getElementById("title").textContent="Select a customer";document.getElementById("messages").innerHTML='<div class="empty">Select a customer from the left to start replying.</div>';document.getElementById("closeBtn").style.display="none";refreshAll()}catch(e){toast(e.message)}}
async function setOnline(v){try{await api("/api/agent/status",{method:"POST",body:JSON.stringify({online:v})});toast(v?"You are online":"You are offline");refreshAll()}catch(e){toast(e.message)}}
function openPassword(){document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" style="display:flex"><div class="modal"><div class="modal-head"><h2>Change My Password</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><input id="cur" class="input full" type="password" placeholder="Current password"><input id="nw" class="input" type="password" placeholder="New password"><input id="nw2" class="input" type="password" placeholder="Confirm new password"></div><div class="form-actions"><button class="btn gold" onclick="changePassword()">Save Password</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div></div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
async function changePassword(){const currentPassword=document.getElementById("cur").value,newPassword=document.getElementById("nw").value,confirm=document.getElementById("nw2").value;if(!currentPassword||!newPassword)return toast("Enter current and new password");if(newPassword.length<6)return toast("New password must be at least 6 characters");if(newPassword!==confirm)return toast("New passwords do not match");try{await api("/api/agent/me/password",{method:"PATCH",body:JSON.stringify({currentPassword,newPassword})});closeModal();toast("Password changed successfully")}catch(e){toast(e.message)}}
async function logout(){await api("/api/logout",{method:"POST"}).catch(()=>{});if(socket)socket.close();clearInterval(refreshTimer);localStorage.removeItem("ae_agent_token");location.href="/agent-login.html"}
function scrollMessages(){const m=document.getElementById("messages");if(m)m.scrollTop=m.scrollHeight}
init();
</script></body></html>
