<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — Abhishek Events</title><link rel="stylesheet" href="/dashboard.css"></head><body>
<div id="app"></div><div id="modalRoot"></div><div id="toast" class="toast"></div>
<script>
const API_BASE="https://abhishek-events-live-chat.onrender.com";const token=localStorage.getItem("ae_admin_token");
if(!token) location.href="/admin-login.html";
let refreshTimer;
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function api(path,opt={}){const r=await fetch(API_BASE+path,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{}),Authorization:"Bearer "+token}});let d={};try{d=await r.json()}catch{}if(!r.ok){if(r.status===401){localStorage.removeItem("ae_admin_token");location.href="/admin-login.html"}throw Error(d.error||"Request failed")}return d}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function stat(icon,label,value,sub){return `<div class="stat"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub||""}</div></div>`}
async function load(){try{const [s,agents,admins,convs]=await Promise.all([api("/api/admin/stats"),api("/api/admin/agents"),api("/api/admin/admins"),api("/api/admin/conversations")]);render(s,agents,admins,convs)}catch(e){toast(e.message)}}
function render(s,agents,admins,convs){document.getElementById("app").innerHTML=`
<header class="top"><div class="brand"><span>✦</span> Abhishek Events <span style="color:#aaa;font:600 12px Arial">ADMIN CENTER</span></div><div class="top-right"><div class="user-chip">Live control panel</div><button class="btn small" onclick="logout()">Logout</button></div></header>
<main class="wrap"><section class="hero"><div><div class="eyebrow">Command Center</div><h1>Admin Dashboard</h1><p>Manage agents, admins and every customer conversation from one place.</p></div><div class="actions"><button class="btn gold" onclick="openAgentModal()">＋ New Agent</button><button class="btn ghost" onclick="openAdminModal()">＋ New Admin</button><button class="btn ghost" onclick="load()">↻ Refresh</button></div></section>
<section class="stats">${stat("👥","Total Agents",s.totalAgents,`${s.onlineAgents} online now`)}${stat("💬","Active Chats",s.activeChats,"Customers currently with agents")}${stat("⏳","Waiting Chats",s.waitingChats,"Waiting for an available agent")}${stat("✓","Closed Chats",s.closedChats,`${s.totalChats} total conversations`)}</section>
<section class="layout"><div>
<div class="card"><div class="card-head"><h2>Agent Management</h2><span class="refresh">Auto refresh 5s</span></div><p class="section-note">Create agents, change capacity/passwords and enable or disable access.</p><div class="list">${agents.length?agents.map(agentCard).join(""):`<div class="empty">No agents created yet.<br>Use <b>New Agent</b> to add your first support agent.</div>`}</div></div>
<div class="card"><div class="card-head"><h2>Admin Accounts</h2><span class="badge active">${s.totalAdmins} active</span></div><p class="section-note">Add additional administrators and manage their access.</p><div class="list">${admins.map(adminCard).join("")}</div></div>
<div class="card"><div class="card-head"><h2>My Security</h2><span class="badge">Protected</span></div><p class="section-note">Change the password for the admin account you are currently using.</p><button class="btn gold" onclick="openMyPassword()">🔐 Change My Password</button></div>
</div><div class="card"><div class="card-head"><h2>All Conversations</h2><span class="refresh">${convs.length} records</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Assigned Agent</th><th>Status</th><th>Created</th></tr></thead><tbody>${convs.length?convs.map(c=>`<tr><td><b>${esc(c.customer_name)}</b></td><td>${esc(c.agent_name||"Waiting for agent")}</td><td><span class="badge ${c.status}"><span class="dot"></span>${esc(c.status)}</span></td><td>${esc(c.created_at)}</td></tr>`).join(""):`<tr><td colspan="4"><div class="empty">No customer conversations yet. Open the website chat to create one.</div></td></tr>`}</tbody></table></div></div></section></main>`}
function agentCard(a){const pct=Math.min(100,a.capacity?Math.round(a.current/a.capacity*100):0);return `<div class="person"><div class="person-top"><div><div class="person-name">${esc(a.name)}</div><div class="person-meta">@${esc(a.username)} · ${a.current}/${a.capacity} active customers</div></div><span class="badge ${a.online&&a.active?"online":"offline"}"><span class="dot"></span>${a.online&&a.active?"Online":"Offline"}</span></div><div class="capacity-bar"><div class="capacity-fill" style="width:${pct}%"></div></div><div class="person-actions"><button class="btn small ghost" onclick="editCapacity(${a.id},${a.capacity})">Capacity</button><button class="btn small ghost" onclick="resetAgentPassword(${a.id})">🔑 Password</button><button class="btn small ${a.active?"danger":"gold"}" onclick="toggleAgent(${a.id},${!!a.active})">${a.active?"Disable":"Enable"}</button></div></div>`}
function adminCard(a){return `<div class="person"><div class="person-top"><div><div class="person-name">${esc(a.name)}</div><div class="person-meta">@${esc(a.username)}</div></div><span class="badge ${a.active?"online":"offline"}">${a.active?"Active":"Disabled"}</span></div><div class="person-actions"><button class="btn small ghost" onclick="resetAdminPassword(${a.id})">🔑 Set Password</button><button class="btn small ${a.active?"danger":"gold"}" onclick="toggleAdmin(${a.id},${!!a.active})">${a.active?"Disable":"Enable"}</button></div></div>`}
function modal(title,body){document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" id="backdrop" style="display:flex"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function openAgentModal(){modal("Create New Agent",`<p class="section-note">Give the agent a unique username and a starting customer capacity.</p><div class="form-grid"><input id="mAgentName" class="input full" placeholder="Agent full name"><input id="mAgentUser" class="input" placeholder="Username"><input id="mAgentPass" class="input" type="password" placeholder="Password (6+ characters)"><input id="mAgentCap" class="input full" type="number" min="1" max="100" value="5" placeholder="Customer capacity"></div><div class="form-actions"><button class="btn gold" onclick="createAgent()">Create Agent</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
async function createAgent(){const name=document.getElementById("mAgentName").value.trim(),username=document.getElementById("mAgentUser").value.trim(),password=document.getElementById("mAgentPass").value,capacity=Number(document.getElementById("mAgentCap").value);if(!name||!username||!password)return toast("Name, username and password are required");if(password.length<6)return toast("Password must be at least 6 characters");try{await api("/api/admin/agents",{method:"POST",body:JSON.stringify({name,username,password,capacity})});closeModal();toast("Agent created successfully");load()}catch(e){toast(e.message)}}
function openAdminModal(){modal("Create Admin Account",`<p class="section-note">This person will have full admin access to the dashboard.</p><div class="form-grid"><input id="mAdminName" class="input full" placeholder="Admin full name"><input id="mAdminUser" class="input" placeholder="Username"><input id="mAdminPass" class="input" type="password" placeholder="Password (6+ characters)"></div><div class="form-actions"><button class="btn gold" onclick="createAdmin()">Create Admin</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
async function createAdmin(){const name=document.getElementById("mAdminName").value.trim(),username=document.getElementById("mAdminUser").value.trim(),password=document.getElementById("mAdminPass").value;if(!name||!username||!password)return toast("Name, username and password are required");if(password.length<6)return toast("Password must be at least 6 characters");try{await api("/api/admin/admins",{method:"POST",body:JSON.stringify({name,username,password})});closeModal();toast("Admin account created");load()}catch(e){toast(e.message)}}
function openMyPassword(){modal("Change My Password",`<div class="form-grid"><input id="cur" class="input full" type="password" placeholder="Current password"><input id="nw" class="input" type="password" placeholder="New password"><input id="nw2" class="input" type="password" placeholder="Confirm new password"></div><div class="form-actions"><button class="btn gold" onclick="changeMyPassword()">Save Password</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
async function changeMyPassword(){const currentPassword=document.getElementById("cur").value,newPassword=document.getElementById("nw").value,confirm=document.getElementById("nw2").value;if(!currentPassword||!newPassword)return toast("Enter current and new password");if(newPassword.length<6)return toast("New password must be at least 6 characters");if(newPassword!==confirm)return toast("New passwords do not match");try{await api("/api/admin/me/password",{method:"PATCH",body:JSON.stringify({currentPassword,newPassword})});closeModal();toast("Password changed successfully") }catch(e){toast(e.message)}}
function resetAgentPassword(id){modal("Set Agent Password",`<p class="section-note">Set a new password for this agent.</p><input id="resetPass" class="input" type="password" placeholder="New password (6+ characters)"><div class="form-actions"><button class="btn gold" onclick="saveAgentPassword(${id})">Save Password</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
async function saveAgentPassword(id){const password=document.getElementById("resetPass").value;if(password.length<6)return toast("Password must be at least 6 characters");try{await api("/api/admin/agents/"+id,{method:"PATCH",body:JSON.stringify({password})});closeModal();toast("Agent password updated")}catch(e){toast(e.message)}}
function resetAdminPassword(id){modal("Set Admin Password",`<input id="resetAdminPass" class="input" type="password" placeholder="New password (6+ characters)"><div class="form-actions"><button class="btn gold" onclick="saveAdminPassword(${id})">Save Password</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
async function saveAdminPassword(id){const password=document.getElementById("resetAdminPass").value;if(password.length<6)return toast("Password must be at least 6 characters");try{await api("/api/admin/admins/"+id,{method:"PATCH",body:JSON.stringify({password})});closeModal();toast("Admin password updated")}catch(e){toast(e.message)}}
async function toggleAgent(id,active){try{await api("/api/admin/agents/"+id,{method:"PATCH",body:JSON.stringify({active:!active})});toast(active?"Agent disabled":"Agent enabled");load()}catch(e){toast(e.message)}}
async function toggleAdmin(id,active){try{await api("/api/admin/admins/"+id,{method:"PATCH",body:JSON.stringify({active:!active})});toast(active?"Admin disabled":"Admin enabled");load()}catch(e){toast(e.message)}}
async function editCapacity(id,current){const value=prompt("Maximum active customers for this agent:",current);if(value===null)return;const n=Number(value);if(!Number.isInteger(n)||n<1||n>100)return toast("Capacity must be between 1 and 100");try{await api("/api/admin/agents/"+id,{method:"PATCH",body:JSON.stringify({capacity:n})});toast("Capacity updated");load()}catch(e){toast(e.message)}}
async function logout(){await api("/api/logout",{method:"POST"}).catch(()=>{});localStorage.removeItem("ae_admin_token");clearInterval(refreshTimer);location.href="/admin-login.html"}
load();refreshTimer=setInterval(load,5000);
</script></body></html>
