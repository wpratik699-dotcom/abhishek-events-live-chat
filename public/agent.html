<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent — Abhishek Events</title><link rel="stylesheet" href="/dashboard.css"></head><body><div id="app"></div>
<script>
const token=localStorage.getItem("ae_agent_token"); if(!token) location.href="/agent-login.html";
let selected=null, socket=null;
if(token) init();
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function init(){const me=await api("/api/agent/me");document.getElementById("app").innerHTML=`<div class="top"><div class="brand"><span>✦</span> Abhishek Events Agent</div><div>${esc(me.name)} · <span id="capacity">${me.current}/${me.capacity}</span> <button class="btn" style="width:auto" onclick="logout()">Logout</button></div></div><div class="wrap"><div class="grid"><div class="card"><h2>My Customers</h2><button class="btn gold" onclick="setOnline(true)">🟢 Online</button><button class="btn" style="margin-top:8px" onclick="setOnline(false)">🔴 Offline</button><div id="list">Loading...</div></div><div class="card"><h2 id="title">Select a customer</h2><div id="messages" class="messages">Your conversations will appear here.</div><div class="composer"><input id="input" class="input" placeholder="Type a reply..." onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button></div><button id="close" class="btn" style="margin-top:8px;display:none" onclick="closeChat()">Close conversation</button></div></div></div>`;await loadList();setOnline(true)}
async function loadList(){const rows=await api("/api/agent/conversations");document.getElementById("list").innerHTML=rows.length?rows.map(x=>`<div class="conversation ${selected===x.id?"active":""}" onclick="openChat(${x.id},'${esc(x.customer_name).replace(/'/g,"&#39;")}')"><b>${esc(x.customer_name)}</b><br><span class="badge">${x.status}</span></div>`).join(""):"No customers assigned."}
async function openChat(id,name){selected=id;document.getElementById("title").textContent="Chat with "+name;const d=await api("/api/agent/conversations/"+id+"/messages");render(d.messages);document.getElementById("close").style.display=d.conversation.status==="closed"?"none":"block";connect(id)}
function render(ms){document.getElementById("messages").innerHTML=ms.map(m=>`<div class="msg ${m.sender_type}">${esc(m.message)}<div class="small">${m.created_at}</div></div>`).join("");scroll()}
function connect(id){if(socket)socket.close();socket=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/?conversationId="+id+"&token="+encodeURIComponent(token));socket.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==="message"){const el=document.createElement("div");el.className="msg "+d.message.sender_type;el.innerHTML=esc(d.message.message)+`<div class="small">${d.message.created_at}</div>`;messages.appendChild(el);scroll()}if(d.type==="conversation"){loadList();}}}
function send(){const v=input.value.trim();if(!v||!socket||socket.readyState!==1)return;socket.send(JSON.stringify({message:v}));input.value=""}
async function closeChat(){if(!selected)return;await api("/api/conversations/"+selected+"/close",{method:"POST"});document.getElementById("close").style.display="none";loadList()}
async function setOnline(v){await api("/api/agent/status",{method:"POST",body:JSON.stringify({online:v})});}
async function logout(){await api("/api/logout",{method:"POST"}).catch(()=>{});localStorage.removeItem("ae_agent_token");location.href="/agent-login.html"}
function scroll(){messages.scrollTop=messages.scrollHeight} function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
