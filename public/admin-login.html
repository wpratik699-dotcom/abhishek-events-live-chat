<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/dashboard.css"></head><body><div class="card login"><h1>Admin Login</h1><p class="muted">Abhishek Events</p><input id="u" class="input" placeholder="Username" value="admin"><br><br><input id="p" class="input" type="password" placeholder="Password"><br><br><button class="btn gold" onclick="login()">Login</button><p id="err" class="danger"></p></div><script>async function login(){const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!r.ok){err.textContent=d.error;return}if(d.user.role!=="admin"){err.textContent="This is not an admin account.";return}localStorage.setItem("ae_admin_token",d.token);location.href="/admin.html"}</script></body></html>
