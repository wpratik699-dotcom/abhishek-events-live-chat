<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Login — Abhishek Events</title><link rel="stylesheet" href="/dashboard.css"></head><body><main class="login-shell"><section class="login"><div class="login-brand"><span>✦</span> Abhishek Events</div><div class="login-sub">Customer Support Agent Portal</div><input id="u" class="input" placeholder="Username" autocomplete="username"><input id="p" class="input" type="password" placeholder="Password" autocomplete="current-password"><button class="btn gold" style="width:100%;margin-top:4px" onclick="login()">Sign in to Agent Portal</button><div id="err" class="error"></div></section></main><script>const API_BASE="https://abhishek-events-live-chat.onrender.com";async function login(){const username=document.getElementById("u").value.trim(),password=document.getElementById("p").value;const err=document.getElementById("err");err.textContent="";try{const r=await fetch(API_BASE+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");if(d.user.role!=="agent")throw Error("This account is not an agent account.");localStorage.setItem("ae_agent_token",d.token);location.href="/agent.html"}catch(e){err.textContent=e.message}}</script></body></html>
